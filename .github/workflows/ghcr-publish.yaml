name: GHCR Publish

# Build the patches branch into ghcr.io/seklfreak/openmessage. The
# ts-<unixtime>-<sha> tag is what the homelab's Flux ImagePolicy sorts
# on (no semver exists in this project); sha-* and latest are for
# humans.
#
# Also callable (workflow_call) from the upstream-sync job: its rebase
# force-push runs as GITHUB_TOKEN, and pushes made with that token never
# trigger a push event, so the sync workflow has to invoke this build
# explicitly. The caller passes the commit to build via `ref` — the
# push-event default (github.sha) would be the pre-rebase tip there.
#
# This workflow is the only test gate `patches` has, so it runs the suite
# itself before building; see the `test` job below.

on:
  push:
    branches: [ "patches" ]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build; defaults to the triggering commit.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the triggering commit.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # Nothing else gates this branch: test.yml runs on pull_request and
  # push:main, and `patches` gets neither — the nightly upstream rebase lands
  # by force-push. Without this the image would build and Flux would roll out
  # a tree no test ever saw. Scoped to the jobs whose failure can break the
  # image, so an unrelated Swift or marketing-site break cannot strand a
  # server fix.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      container_only: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve build commit
        id: commit
        # Tag from the commit actually checked out, not from github.sha:
        # on a workflow_call those differ.
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/seklfreak/openmessage
          tags: |
            type=raw,value=ts-{{date 'X'}}-${{ steps.commit.outputs.short }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=raw,value=latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.commit.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
